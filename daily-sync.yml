name: Daily job sync

on:
  schedule:
    - cron: "35 18 * * *" # 18:35 UTC = 12:05 AM India time
  workflow_dispatch:

concurrency:
  group: fresher-radar-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrate and sync jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
          LLM_MODEL: gemini-3.5-flash-lite
          LLM_MIN_REQUEST_INTERVAL_SECONDS: "5"
          GEMINI_INPUT_PRICE_PER_MILLION: ${{ vars.GEMINI_INPUT_PRICE_PER_MILLION || '0' }}
          GEMINI_OUTPUT_PRICE_PER_MILLION: ${{ vars.GEMINI_OUTPUT_PRICE_PER_MILLION || '0' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "0"
          AUTO_SYNC: "0"
        run: |
          python manage.py migrate --noinput
          python manage.py fetch_jobs
